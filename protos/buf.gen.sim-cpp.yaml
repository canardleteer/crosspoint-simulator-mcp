# Remote C++ plugins pinned to current BSR releases (see
# https://buf.build/plugins/cpp). Deposited stubs need a matching local
# protobuf / grpc++ prefix (v35.1 / v1.83.0), not Ubuntu 24.04 apt.
version: v2
plugins:
  - remote: buf.build/protocolbuffers/cpp:v35.1
    out: ../crosspoint-simulator/src/sim_grpc/gen
  - remote: buf.build/grpc/cpp:v1.83.0
    out: ../crosspoint-simulator/src/sim_grpc/gen
