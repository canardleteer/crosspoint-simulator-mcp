[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/csm-proxy"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
buffa = { version = "0.8.1", features = ["json"] }
buffa-types = { version = "0.8.1", features = ["json"] }
buf-tools = "1.72.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
connectrpc = { version = "0.8", features = ["server", "client"] }
csm-pb-bindings = { path = "crates/csm-pb-bindings" }
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
